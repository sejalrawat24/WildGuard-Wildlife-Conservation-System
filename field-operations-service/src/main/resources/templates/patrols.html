
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrol Management</title>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #f3f6f1;
            margin: 0;
            padding: 25px;
            color: #26352a;
        }

        .container { max-width: 1100px; margin: auto; }

        h1, h2 { color: #245c3a; }

        .home-btn {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 5px;
            background: #245c3a;
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            margin: 5px 2px 20px;
        }

        .home-btn:hover { background: #1c5734; }

        .card {
            background: white;
            padding: 22px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        label { font-weight: bold; }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccd5cc;
            border-radius: 5px;
            font-size: 14px;
            margin-bottom: 8px;
        }

        textarea { resize: vertical; min-height: 75px; }

        button, .back-link {
            display: inline-block;
            padding: 10px 16px;
            border: none;
            border-radius: 5px;
            background: #287447;
            color: white;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            margin: 3px 2px;
        }

        button:hover, .back-link:hover { background: #1c5734; }

        .delete-btn { background: #b83232; }
        .delete-btn:hover { background: #8f2424; }

        .search-btn { background: #2867a5; }
        .search-btn:hover { background: #1c4e80; }

        .hide-btn { background: #68756b; }
        .hide-btn:hover { background: #4b574d; }

        .form-actions { margin-top: 18px; }

        .table-wrapper { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #e0e6e0;
            text-align: left;
            vertical-align: top;
        }

        th { background: #e7f0e8; color: #245c3a; }

        .status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .scheduled { background: #fff0c2; color: #795900; }
        .ongoing { background: #d8ebff; color: #14518a; }
        .completed { background: #d8f3df; color: #17632d; }

        .edit-form { min-width: 260px; }

        .empty {
            text-align: center;
            padding: 25px;
            color: #68756b;
        }

        .management-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            margin: 15px 0;
        }

        .search-input { max-width: 220px; margin: 0; }

        #patrolTable { display: none; }

        #message {
            margin: 12px 0;
            font-weight: bold;
        }

        @media (max-width: 650px) {
            body { padding: 12px; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

<body>
<div class="container">

    <h1>Patrol Management</h1>
    <p>Manage wildlife patrol schedules, activities, and status.</p>

    <!-- HOME BUTTON -->
    <a class="home-btn" href="http://localhost:8080/">
        ← Home
    </a>

    <!-- ADD PATROL -->
    <div class="card">
        <h2>Add New Patrol</h2>

        <form th:action="@{/patrols}" th:object="${patrol}" method="post">
            <div class="form-grid">

                <div class="field">
                    <label for="zoneId">Zone ID</label>
                    <input type="number" id="zoneId" th:field="*{zone_id}" min="1" required>
                </div>

                <div class="field">
                    <label for="leaderStaffId">Leader Staff ID</label>
                    <input type="number" id="leaderStaffId" th:field="*{leader_staff_id}" min="1" required>
                </div>

                <div class="field">
                    <label for="patrolDate">Patrol Date</label>
                    <input type="date" id="patrolDate" th:field="*{patrol_date}" required>
                </div>

                <div class="field">
                    <label for="addStatus">Status</label>
                    <select id="addStatus" th:field="*{status}" required>
                        <option value="">Select Status</option>
                        <option value="SCHEDULED">Scheduled</option>
                        <option value="ONGOING">In Progress</option>
                        <option value="COMPLETED">Completed</option>
                    </select>
                </div>

                <div class="field">
                    <label for="routeDescription">Route Description</label>
                    <textarea id="routeDescription" th:field="*{route_description}" required></textarea>
                </div>

                <div class="field">
                    <label for="activities">Activities</label>
                    <textarea id="activities" th:field="*{activities}" required></textarea>
                </div>

            </div>

            <div class="form-actions">
                <button type="submit">Add Patrol</button>
            </div>
        </form>
    </div>

    <!-- PATROL MANAGEMENT -->
    <div class="card">
        <h2>All Patrols</h2>

        <div class="management-actions">
            <button type="button" onclick="showAll()">Show All</button>
            <button type="button" class="hide-btn" onclick="hideAll()">Hide All</button>

            <input type="number" id="searchId" class="search-input"
                   placeholder="Enter Patrol ID" min="1">

            <button type="button" class="search-btn" onclick="searchPatrol()">
                Search by ID
            </button>

            <button type="button" class="hide-btn" onclick="clearSearch()">
                Clear Search
            </button>
        </div>

        <p id="message"></p>

        <div class="table-wrapper">
            <table id="patrolTable">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Zone</th>
                    <th>Leader Staff</th>
                    <th>Date</th>
                    <th>Route</th>
                    <th>Activities</th>
                    <th>Status</th>
                    <th>Update Patrol</th>
                    <th>Delete</th>
                </tr>
                </thead>

                <tbody id="patrolTableBody">
                <tr th:each="p : ${patrols}"
                    th:attr="data-patrol-id=${p.patrol_id}">

                    <td th:text="${p.patrol_id}">1</td>
                    <td th:text="${p.zone_id}">1</td>
                    <td th:text="${p.leader_staff_id}">1</td>
                    <td th:text="${p.patrol_date}">2026-10-10</td>
                    <td th:text="${p.route_description}">Route</td>
                    <td th:text="${p.activities}">Activities</td>

                    <td>
                        <span class="status"
                              th:classappend="${p.status == 'SCHEDULED' ? ' scheduled' : (p.status == 'ONGOING' ? ' ongoing' : (p.status == 'COMPLETED' ? ' completed' : ''))}"
                              th:text="${p.status == 'SCHEDULED' ? 'Scheduled' : (p.status == 'ONGOING' ? 'In Progress' : (p.status == 'COMPLETED' ? 'Completed' : p.status))}">
                            Scheduled
                        </span>
                    </td>

                    <td>
                        <form class="edit-form"
                              th:action="@{/patrols/update/{id}(id=${p.patrol_id})}"
                              method="post">

                            <label>Zone ID</label>
                            <input type="number" name="zone_id"
                                   th:value="${p.zone_id}" min="1" required>

                            <label>Leader Staff ID</label>
                            <input type="number" name="leader_staff_id"
                                   th:value="${p.leader_staff_id}" min="1" required>

                            <label>Patrol Date</label>
                            <input type="date" name="patrol_date"
                                   th:value="${p.patrol_date}" required>

                            <label>Route Description</label>
                            <textarea name="route_description"
                                      th:text="${p.route_description}" required></textarea>

                            <label>Activities</label>
                            <textarea name="activities"
                                      th:text="${p.activities}" required></textarea>

                            <label>Status</label>
                            <select name="status" required>
                                <option value="SCHEDULED"
                                        th:selected="${p.status == 'SCHEDULED'}">Scheduled</option>
                                <option value="ONGOING"
                                        th:selected="${p.status == 'ONGOING'}">In Progress</option>
                                <option value="COMPLETED"
                                        th:selected="${p.status == 'COMPLETED'}">Completed</option>
                            </select>

                            <button type="submit">Save Changes</button>
                        </form>
                    </td>

                    <td>
                        <form th:action="@{/patrols/delete/{id}(id=${p.patrol_id})}"
                              method="post"
                              onsubmit="return confirm('Are you sure you want to delete this patrol?');">
                            <button type="submit" class="delete-btn">Delete</button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(patrols)}" id="emptyRow">
                    <td colspan="9" class="empty">No patrol records found.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const table = document.getElementById("patrolTable");
    const tbody = document.getElementById("patrolTableBody");
    const message = document.getElementById("message");
    const searchInput = document.getElementById("searchId");

    const originalRowsHTML = tbody.innerHTML;

    function showAll() {
        tbody.innerHTML = originalRowsHTML;
        table.style.display = "table";
        message.textContent = "";
    }

    function hideAll() {
        table.style.display = "none";
        message.textContent = "";
    }

    function clearSearch() {
        searchInput.value = "";
        showAll();
    }

    function searchPatrol() {
        const id = searchInput.value.trim();

        if (!id || Number(id) < 1) {
            message.textContent = "Please enter a valid Patrol ID.";
            table.style.display = "none";
            return;
        }

        const temporaryBody = document.createElement("tbody");
        temporaryBody.innerHTML = originalRowsHTML;

        const rows = Array.from(
            temporaryBody.querySelectorAll("tr[data-patrol-id]")
        );

        const found = rows.find(row =>
            row.getAttribute("data-patrol-id") === id
        );

        if (found) {
            tbody.innerHTML = "";
            tbody.appendChild(found.cloneNode(true));
            table.style.display = "table";
            message.textContent = "Patrol found.";
        } else {
            table.style.display = "none";
            message.textContent =
                "Patrol ID not found in the currently loaded patrol records.";
        }
    }

    searchInput.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            searchPatrol();
        }
    });
</script>

</body>
</html>
